{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>
        {% block title %}Podcast Planner{% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="{% static 'homepage/css/style.css' %}"
    >
</head>
<body>
    {% include "includes/navigation.html" %}

    <main class="container pb-5">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="container footer-block">
        <div class="footer-inner">
            <img
                src="{% static 'homepage/img/logo.png' %}"
                class="footer-logo"
                alt="Podcast Planner"
            >
            <span>
                © <span id="current-year"></span>
                {{ site_name|default:"Podcast Planner" }}
            </span>
            <span class="ms-auto small">Подкастов: {{ global_podcast_count }} · Выпусков: {{ global_episode_count }}</span>
        </div>
    </footer>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>
    <script
        src="{% static 'homepage/js/main.js' %}"
    ></script>
</body>
</html>
