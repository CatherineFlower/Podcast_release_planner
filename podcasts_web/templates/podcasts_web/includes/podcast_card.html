<article class="card app-card h-100 podcast-card">
    <div class="card-body d-flex flex-column">
        <div class="d-flex justify-content-between gap-2">
            <h2 class="h5">{{ podcast.title|default:"Без названия" }}</h2>
            <span class="badge text-bg-light">#{{ podcast.id }}</span>
        </div>
        <p class="text-muted">{{ podcast.description|default:"Описание не указано" }}</p>
        <p class="mb-2"><strong>Автор:</strong> {{ podcast.author.name }}</p>
        <p class="small text-muted">Выпусков: {{ podcast.episode_count }}</p>
        <a class="btn btn-primary mt-auto" href="{{ podcast.get_absolute_url }}">Подробнее</a>
    </div>
</article>
